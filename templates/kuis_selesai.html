<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Selesai - Mas Koding</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% set active_page = 'kuis' %}
    {% include '_nav.html' %}

    <main>
        <div class="mk-card mk-summary" style="max-width: 460px; margin: 0 auto;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gold); margin: 0 auto 6px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span class="page-eyebrow" style="justify-content: center; width: 100%;">Kuis selesai</span>
            <div class="mk-summary-score">{{ skor }}<span style="color: var(--ink-soft); font-size: 0.4em;"> / {{ total }}</span></div>
            <p class="mk-summary-total">Skor akhir kamu, mase.</p>

            <div class="mk-actions" style="justify-content: center; margin-top: 20px;">
                <a href="/kuis" class="mk-btn mk-btn-gold">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    Main lagi
                </a>
                <a href="/" class="mk-btn mk-btn-ghost">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Menu utama
                </a>
            </div>
        </div>
    </main>
</body>
</html>
