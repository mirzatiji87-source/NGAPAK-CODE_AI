<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Soal - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% set active_page = 'admin' %}
    {% include '_nav.html' %}

    <main>
        <span class="page-eyebrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Area admin
        </span>
        <h1>Tambah Soal Baru</h1>
        <p class="page-lede">Isi kode buggy, kode yang bener, sama hint-nya buat pemain.</p>

        <div class="mk-card" style="max-width: 640px;">
            <form method="POST">
                <div class="mk-row">
                    <div class="mk-field">
                        <label for="bahasa">Bahasa</label>
                        <select name="bahasa" id="bahasa">
                            <option value="python">Python</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="javascript">JavaScript</option>
                            <option value="csharp">C#</option>
                        </select>
                    </div>
                    <div class="mk-field">
                        <label for="level">Level</label>
                        <select name="level" id="level">
                            <option value="pemula">Pemula</option>
                            <option value="medium">Medium</option>
                            <option value="pro">Pro</option>
                        </select>
                    </div>
                </div>

                <div class="mk-field">
                    <label for="buggy_code">Buggy code (kode yang salah)</label>
                    <textarea name="buggy_code" id="buggy_code" rows="6" class="mk-code"></textarea>
                </div>

                <div class="mk-field">
                    <label for="fixed_code">Fixed code (kode yang benar)</label>
                    <textarea name="fixed_code" id="fixed_code" rows="6" class="mk-code"></textarea>
                </div>

                <div class="mk-field">
                    <label for="hint">Hint (petunjuk)</label>
                    <input type="text" name="hint" id="hint" placeholder="petunjuk singkat buat pemain">
                </div>

                <div class="mk-actions">
                    <button type="submit" class="mk-btn mk-btn-gold">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Simpan soal
                    </button>
                    <a href="/admin/soal" class="mk-btn mk-btn-ghost">Batal</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
